name: Tweet every 80 minutes

on:
  schedule:
    # Every 80 minutes (UTC — GitHub Actions cron is always UTC). Cron has no
    # native "every N minutes" step past 59, so 80 minutes is expressed as
    # three fixed minute/hour pairs that land exactly 80 minutes apart and
    # repeat on a 4-hour cycle (00:00, 01:20, 02:40, 04:00, 05:20, 06:40, ...).
    # NOTE: GitHub does not guarantee exact timing; scheduled runs can be
    # delayed by several minutes (occasionally more) under load. The interval
    # gate in pipeline.py still enforces the 80-minute floor despite any
    # cron jitter.
    - cron: "0 0,4,8,12,16,20 * * *"
    - cron: "20 1,5,9,13,17,21 * * *"
    - cron: "40 2,6,10,14,18,22 * * *"
  # Manual trigger button in the Actions tab, for testing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compose but do not post)"
        type: boolean
        default: false

# Never let two runs overlap (e.g. a delayed run colliding with the next
# hour's) — they'd race on posted_history.json.
concurrency:
  group: hourly-tweet
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit posted_history.json back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (single cycle)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # Optional — leave the secret unset to use the free composer:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --once --dry-run
          else
            python main.py --once
          fi

      - name: Persist posted history
        # Runners are ephemeral: without this commit, the dedup history
        # would reset every hour and the bot could re-post the same story.
        # posted_analytics.jsonl rides along — it is append-only, so it also
        # needs committing back or each run's record is lost with the runner.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A over the directory rather than naming both files: git add on a
          # path that does not exist yet exits 128, and posted_analytics.jsonl
          # is absent until the first post lands. Ignored dumps in data/ are
          # still skipped via .gitignore.
          git add -A data/
          if git diff --cached --quiet; then
            echo "No history changes to commit (nothing was posted this cycle)."
          else
            git commit -m "chore: update posted history [skip ci]"
            # Rebase in case another workflow/manual commit landed meanwhile.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
